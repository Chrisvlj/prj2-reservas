<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Reservas de laboratorios</title>
  <style>
    body { font: 16px/1.4 "Segoe UI", sans-serif; margin: 0; color: #1c2430; background: #f4f6f8; }
    header { background: #16324f; color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    header a { color: white; margin-left: 16px; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .tarjeta { background: white; border: 1px solid #d5dde6; border-radius: 8px; padding: 16px; }
    label { display: block; margin: 10px 0 4px; }
    input, select, button { font: inherit; padding: 8px; }
    button, .boton { background: #16324f; color: white; border: 0; border-radius: 4px; cursor: pointer; }
    .error { background: #fde8e6; border: 1px solid #e3b0aa; padding: 8px 12px; border-radius: 4px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #d5dde6; padding: 6px; text-align: center; }
    td.libre { background: #e5f6ea; }
    td.reservada { background: #fde2e1; }
    td.deshabilitada { background: #eceff3; }
    td.mantenimiento { background: #fff4d5; }
    .fila { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-top: 16px; }
  </style>
</head>
<body>
  <header>
    <strong>Reservas de laboratorios</strong>
    <nav>
      
        <span>Rosa · administrador</span>
        <a href="/">Disponibilidad</a>
        <a href="/reservas">Mis reservas</a>
        <a href="/admin">Administración</a>
        <form action="/salir" method="post" style="display:inline"><button type="submit">Salir</button></form>
      
    </nav>
  </header>
  <main>
    
    
<section class="tarjeta">
  <h1>Administración</h1>
  <p>Ocupación del 2026-11-16: 0 de 32 franjas (0 %).</p>
  <h2>Reserva presencial</h2>
  <form method="post" action="/admin/presencial">
    <div class="fila">
      <div>
        <label for="usuario_id">Titular</label>
        <select id="usuario_id" name="usuario_id">
          
            <option value="1">Ana (estudiante)</option>
          
            <option value="2">Luis (docente)</option>
          
            <option value="3">Rosa (administrador)</option>
          
        </select>
      </div>
      <div>
        <label for="laboratorio_id">Laboratorio</label>
        <input id="laboratorio_id" name="laboratorio_id" type="number" min="1" value="1">
      </div>
      <div>
        <label for="fecha">Fecha</label>
        <input id="fecha" name="fecha" type="date" value="2026-11-16" required>
      </div>
      <div>
        <label for="bloque_inicio">Desde</label>
        <input id="bloque_inicio" name="bloque_inicio" type="number" min="1" max="16" value="1">
      </div>
      <div>
        <label for="bloque_fin">Hasta</label>
        <input id="bloque_fin" name="bloque_fin" type="number" min="1" max="16" value="1">
      </div>
      <button type="submit">Registrar</button>
    </div>
  </form>
  <h2>Mantenimiento</h2>
  <form method="post" action="/admin/mantenimiento">
    <div class="fila">
      <input name="laboratorio_id" type="number" min="1" value="1" aria-label="Laboratorio">
      <input name="fecha" type="date" value="2026-11-16" required aria-label="Fecha">
      <input name="bloque" type="number" min="1" max="16" value="1" aria-label="Bloque">
      <select name="activo" aria-label="Acción">
        <option value="true">Bloquear</option>
        <option value="false">Reabrir</option>
      </select>
      <button type="submit">Aplicar</button>
    </div>
  </form>
  <h2>Liberar franja deshabilitada</h2>
  <form method="post" action="/admin/liberar">
    <div class="fila">
      <input name="laboratorio_id" type="number" min="1" value="1" aria-label="Laboratorio">
      <input name="fecha" type="date" value="2026-11-16" required aria-label="Fecha">
      <input name="bloque" type="number" min="1" max="16" value="1" aria-label="Bloque">
      <button type="submit">Liberar</button>
    </div>
  </form>
</section>

  </main>
</body>
</html>
