{% extends "base.html" %}
{% block titulo %}Entrar · Reservas{% endblock %}
{% block contenido %}
<section class="tarjeta" style="max-width: 420px;">
  <h1>Entrar</h1>
  <p>Cuentas de demostración: ana@lab.test, luis@lab.test y rosa@lab.test. La clave es el nombre en minúsculas.</p>
  <form method="post" action="/entrar">
    <label for="correo">Correo</label>
    <input id="correo" name="correo" type="email" required>
    <label for="clave">Clave</label>
    <input id="clave" name="clave" type="password" required>
    <div class="fila"><button type="submit">Entrar</button></div>
  </form>
</section>
{% endblock %}
